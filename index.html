<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Tracker — Lujo Network</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F8F9FA;--surface:#fff;--border:#E5E7EB;--border2:#D1D5DB;
  --text:#111827;--muted:#6B7280;--muted2:#9CA3AF;
  --accent:#1A56DB;--accent-light:#EBF0FF;
  --green:#057A55;--green-bg:#ECFDF5;--green-border:#A7F3D0;
  --red:#E02424;--red-bg:#FEF2F2;--red-border:#FECACA;
  --amber:#92400E;--amber-bg:#FFFBEB;--amber-border:#FDE68A;
  --header:#1E293B;
}
html{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
body{min-height:100vh;}

.header{background:var(--header);color:#fff;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{font-size:14px;font-weight:600;letter-spacing:0.02em;}
.brand span{color:#60A5FA;}
.hdiv{width:1px;height:18px;background:rgba(255,255,255,0.15);margin:0 14px;}
.hsub{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.06em;text-transform:uppercase;}
.hright{display:flex;align-items:center;gap:8px;}
.sync-chip{font-size:11px;color:rgba(255,255,255,0.45);padding:3px 9px;border:1px solid rgba(255,255,255,0.12);border-radius:4px;}
.hbtn{font-family:'Inter',sans-serif;font-size:12px;padding:5px 12px;border-radius:5px;cursor:pointer;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.07);color:#fff;transition:all 0.15s;}
.hbtn:hover{background:rgba(255,255,255,0.14);}
.uchip{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.65);}
.uavatar{width:25px;height:25px;border-radius:50%;background:#1A56DB;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 54px);}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:40px;width:380px;text-align:center;}
.llogo{font-size:19px;font-weight:600;color:var(--header);margin-bottom:6px;}.llogo span{color:#1A56DB;}
.lsub{font-size:13px;color:var(--muted);margin-bottom:26px;}
.ldiv{height:1px;background:var(--border);margin:18px 0;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border-radius:7px;border:1px solid var(--border2);background:#fff;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn-google:hover{background:#F9FAFB;border-color:#9CA3AF;}
.btn-google svg{width:17px;height:17px;}
.lnote{font-size:11px;color:var(--muted2);margin-top:14px;line-height:1.7;}

/* MAIN */
.main{max-width:1160px;margin:0 auto;padding:24px 24px 60px;}

/* BANNER */
.banner{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:18px;}
.banner.loading{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.banner.error{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.banner.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.spinner{width:13px;height:13px;border:2px solid var(--amber-border);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ALERTS */
.alerts-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.alert-item{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:6px;font-size:12px;}
.alert-item.warn{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.alert-item.info{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.alert-icon{font-size:14px;flex-shrink:0;}

/* CONTROLS ROW */
.controls-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border2);border-radius:6px;font-family:'Inter',sans-serif;font-size:12px;color:var(--text);background:#fff;}
.search-wrap input:focus{outline:none;border-color:#1A56DB;box-shadow:0 0 0 3px rgba(26,86,219,0.08);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:14px;}
.alert-config{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.alert-config input[type=number]{width:60px;padding:5px 8px;border:1px solid var(--border2);border-radius:5px;font-family:'Inter',sans-serif;font-size:12px;text-align:center;}
.btn-sm{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all 0.15s;white-space:nowrap;}
.btn-sm:hover{background:#F9FAFB;}
.btn-sm.primary{background:#1A56DB;border-color:#1A56DB;color:#fff;}
.btn-sm.primary:hover{background:#1648C0;}
.btn-sm.success{background:var(--green);border-color:var(--green);color:#fff;}
.btn-sm.success:hover{opacity:0.9;}

/* SONGS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;}
.songs-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.song-chip{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;color:var(--muted);transition:all 0.15s;user-select:none;}
.song-chip:hover{color:var(--text);border-color:#9CA3AF;}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px;}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;border-top:3px solid #ccc;}
.mcard-song{font-size:10px;color:var(--muted2);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mcard-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.mcard-value{font-size:24px;font-weight:600;color:var(--text);line-height:1;margin-bottom:5px;}
.mcard-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.mbadge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;}
.mbadge.up{color:var(--green);background:var(--green-bg);}
.mbadge.down{color:var(--red);background:var(--red-bg);}
.mbadge.flat{color:var(--muted);background:#F3F4F6;}
.trend{font-size:11px;display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;}
.trend.up{color:var(--green);background:var(--green-bg);}
.trend.down{color:var(--red);background:var(--red-bg);}
.trend.flat{color:var(--muted);background:#F3F4F6;}
.last-upd{font-size:10px;color:var(--muted2);margin-top:4px;}

/* CHART PANEL */
.chart-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:20px;}
.chart-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.chart-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ctab{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:5px 11px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.ctab:hover{color:var(--text);}
.ctab.active{background:var(--header);color:#fff;border-color:var(--header);}
.range-tabs{display:flex;gap:3px;}
.rtab{font-family:'Inter',sans-serif;font-size:11px;padding:4px 9px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.rtab:hover{color:var(--text);}
.rtab.active{background:var(--accent-light);color:var(--accent);border-color:#BFDBFE;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:50%;}
.chart-wrap{position:relative;height:240px;}

/* TABLE */
.table-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#F9FAFB;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead{background:#F9FAFB;}
th{text-align:left;padding:10px 14px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--text);}
th .sort-icon{margin-left:4px;opacity:0.4;}
th.sorted .sort-icon{opacity:1;}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FAFAFA;}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.bbadge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;}
.bbadge.up{color:var(--green);background:var(--green-bg);}
.bbadge.down{color:var(--red);background:var(--red-bg);}
.bbadge.flat{color:var(--muted);background:#F3F4F6;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:10px;border:1px solid var(--border);padding:26px;width:400px;max-width:95vw;}
.modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:18px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.field input,.field select{width:100%;padding:7px 10px;border:1px solid var(--border2);border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);background:#fff;}
.field input:focus,.field select:focus{outline:none;border-color:#1A56DB;box-shadow:0 0 0 3px rgba(26,86,219,0.08);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.modal-error{font-size:11px;color:var(--red);margin-top:6px;display:none;}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;">
    <div class="brand">LUJO <span>NETWORK</span></div>
    <div class="hdiv"></div>
    <div class="hsub">TikTok Performance</div>
  </div>
  <div class="hright">
    <span class="sync-chip" id="sync-badge">—</span>
    <button class="hbtn" onclick="loadSheetData()">↺ Sync</button>
    <div class="uchip">
      <div class="uavatar" id="user-avatar">?</div>
      <span id="user-name">—</span>
    </div>
    <button class="hbtn" onclick="handleLogout()">Salir</button>
  </div>
</div>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">LUJO <span>NETWORK</span></div>
    <div class="lsub">TikTok Performance Tracker</div>
    <button class="btn-google" onclick="handleLogin()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Iniciar sesión con Google
    </button>
    <div class="ldiv"></div>
    <div class="lnote">Solo lectura. Necesitas acceso al Sheet de Lujo Network.</div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <div class="main">
    <div class="banner" id="state-banner"></div>
    <div class="alerts-wrap" id="alerts-wrap"></div>

    <!-- CONTROLS -->
    <div class="controls-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar canción…" oninput="renderSongs()">
      </div>
      <div class="alert-config">
        <span>Alerta si cae más de</span>
        <input type="number" id="alert-threshold" value="1" min="0.1" step="0.1">
        <span>%</span>
      </div>
      <button class="btn-sm success" onclick="exportCSV()">↓ Exportar CSV</button>
    </div>

    <!-- CANCIONES -->
    <div class="sec-hdr"><div class="sec-title">Canciones</div></div>
    <div class="songs-row" id="songs-row"></div>

    <!-- MÉTRICAS -->
    <div class="sec-hdr"><div class="sec-title">Último registro</div></div>
    <div class="metrics-grid" id="metrics-grid"></div>

    <!-- GRÁFICO -->
    <div class="chart-panel">
      <div class="chart-toolbar">
        <div class="chart-left">
          <div style="display:flex;gap:4px;">
            <button class="ctab active" onclick="switchMetric('publicaciones',this)">Publicaciones</button>
            <button class="ctab" onclick="switchMetric('visualizaciones',this)">Visualizaciones</button>
            <button class="ctab" onclick="switchMetric('crecimiento',this)">Crecimiento %</button>
          </div>
          <div class="range-tabs" style="margin-left:6px;">
            <button class="rtab" onclick="switchRange(7,this)">7d</button>
            <button class="rtab" onclick="switchRange(14,this)">14d</button>
            <button class="rtab" onclick="switchRange(30,this)">30d</button>
            <button class="rtab active" onclick="switchRange(0,this)">Todo</button>
          </div>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="mainChart" role="img" aria-label="Gráfico de evolución de métricas TikTok"></canvas>
      </div>
    </div>

    <!-- TABLA -->
    <div class="sec-hdr"><div class="sec-title">Historial</div></div>
    <div class="table-panel">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('date')">Fecha <span class="sort-icon" id="sort-date">↕</span></th>
            <th>Canción</th>
            <th onclick="sortBy('publicaciones')">Publicaciones <span class="sort-icon" id="sort-publicaciones">↕</span></th>
            <th onclick="sortBy('visualizaciones')">Visualizaciones <span class="sort-icon" id="sort-visualizaciones">↕</span></th>
            <th onclick="sortBy('crecPub')">Crec. pub <span class="sort-icon" id="sort-crecPub">↕</span></th>
            <th onclick="sortBy('crecVis')">Crec. vis <span class="sort-icon" id="sort-crecVis">↕</span></th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const CLIENT_ID   = '563877446146-oa68854qmu92v4e19do9g9a8dhq579ui.apps.googleusercontent.com';
const SHEET_ID    = '1NbIGjdWhhH2tBagJfaJ5_fVwNAGAvCnhLayA5KEiihs';
const SHEET_REG   = 'Registros';
const SHEET_SONGS = 'Canciones';
const SCOPES      = 'https://www.googleapis.com/auth/spreadsheets.readonly';
const PALETTE     = ['#1A56DB','#7E3AF2','#057A55','#E3A008','#E02424','#0694A2','#9061F9','#31C48D','#F98080','#3F83F8','#8DA2FB','#F6AD55','#FC8181','#4FD1C5','#F687B3'];

let SONGS=[],history=[],selectedSongs=[],currentMetric='publicaciones',dateRange=0,sortCol='date',sortDir=-1,chart=null,tokenClient=null,accessToken=null;

function songColor(i){ return PALETTE[i%PALETTE.length]; }
function fmt(n){
  if(n==null||isNaN(n))return'—';
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString('es-ES');
}
function fmtPct(v){ if(v==null||isNaN(v))return'—'; return(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(2)+'%'; }
function dc(v){ return v==null||isNaN(v)?'flat':v>0?'up':v<0?'down':'flat'; }
function getLatest(sid){ return [...history].filter(r=>r.songId===sid).sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }
function getPrev(sid,bd){ return [...history].filter(r=>r.songId===sid&&r.date<bd).sort((a,b)=>b.date.localeCompare(a.date))[0]||null; }
function calcCrec(n,p){ return(!p||p===0)?null:((n-p)/p)*100; }

function showBanner(type,msg){
  const el=document.getElementById('state-banner');
  el.style.display='flex';el.className='banner '+type;
  el.innerHTML=type==='loading'?`<div class="spinner"></div><span>${msg}</span>`:`<span>${msg}</span>`;
}
function hideBanner(){ document.getElementById('state-banner').style.display='none'; }

// ── AUTH ───────────────────────────────────────────────────
function initGoogleAuth(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:async(resp)=>{
      if(resp.error){showBanner('error','Error de autenticación: '+resp.error);return;}
      accessToken=resp.access_token;showDashboard();await loadSheetData();
    }
  });
}
function handleLogin(){ tokenClient.requestAccessToken(); }
function handleLogout(){
  if(accessToken) google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken=null;history=[];
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function showDashboard(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}})
    .then(r=>r.json()).then(u=>{
      const name=u.given_name||u.name||'Usuario';
      document.getElementById('user-name').textContent=name;
      document.getElementById('user-avatar').textContent=name[0].toUpperCase();
    }).catch(()=>{});
}

// ── SHEETS ─────────────────────────────────────────────────
function parseDateToISO(d){
  d=String(d||'').trim();
  if(d.includes('/')){const p=d.split('/');return`${p[2]||'2026'}-${(p[1]||'01').padStart(2,'0')}-${(p[0]||'01').padStart(2,'0')}`;}
  return d;
}
async function fetchRange(range){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const resp=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.statusText);}
  return(await resp.json()).values||[];
}
async function loadSheetData(){
  if(!accessToken){showBanner('error','Sesión expirada.');return;}
  showBanner('loading','Cargando datos…');
  try{
    const songRows=await fetchRange(SHEET_SONGS+'!A2:A');
    const songNames=songRows.map(r=>(r[0]||'').trim()).filter(Boolean);
    SONGS=songNames.map((name,i)=>({id:i,name,color:songColor(i)}));
    selectedSongs=SONGS.map(s=>s.id);

    const rows=await fetchRange(SHEET_REG+'!A2:F');
    history=rows.map(r=>{
      const songName=(r[1]||'').trim();
      const songId=SONGS.findIndex(s=>s.name.toLowerCase()===songName.toLowerCase());
      return{
        date:parseDateToISO((r[0]||'').trim()),
        songId:songId>=0?songId:0,songName,
        publicaciones:parseFloat((r[2]||'').toString().replace(/[^0-9.]/g,'')),
        visualizaciones:parseFloat((r[3]||'').toString().replace(/[^0-9.]/g,'')),
        crecPub:parseFloat((r[4]||'').toString().replace(/[^0-9.,-]/g,'').replace(',','.')),
        crecVis:parseFloat((r[5]||'').toString().replace(/[^0-9.,-]/g,'').replace(',','.')),
      };
    }).filter(r=>r.date&&!isNaN(r.publicaciones));

    const now=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('sync-badge').textContent='Sync '+now;
    hideBanner();
    checkAlerts();
    renderAll();
  }catch(e){showBanner('error','Error: '+e.message);}
}

// ── ALERTAS ────────────────────────────────────────────────
function checkAlerts(){
  const threshold=parseFloat(document.getElementById('alert-threshold').value)||1;
  const wrap=document.getElementById('alerts-wrap');
  const alerts=[];
  SONGS.forEach(s=>{
    const lat=getLatest(s.id);
    if(!lat)return;
    const prev=getPrev(s.id,lat.date);
    if(!prev)return;
    const dPub=calcCrec(lat.publicaciones,prev.publicaciones);
    const dVis=calcCrec(lat.visualizaciones,prev.visualizaciones);
    if(dPub!==null&&dPub<-threshold)
      alerts.push(`<div class="alert-item warn"><span class="alert-icon">⚠</span><strong>${s.name}</strong>: publicaciones cayeron ${Math.abs(dPub).toFixed(2)}% el ${lat.date}</div>`);
    if(dVis!==null&&dVis<-threshold)
      alerts.push(`<div class="alert-item warn"><span class="alert-icon">⚠</span><strong>${s.name}</strong>: visualizaciones cayeron ${Math.abs(dVis).toFixed(2)}% el ${lat.date}</div>`);
  });
  // Alerta sin actualizar en más de 3 días
  SONGS.forEach(s=>{
    const lat=getLatest(s.id);
    if(!lat)return;
    const diff=(new Date()-new Date(lat.date))/(1000*60*60*24);
    if(diff>3)
      alerts.push(`<div class="alert-item info"><span class="alert-icon">🕐</span><strong>${s.name}</strong>: sin registros hace ${Math.round(diff)} días (último: ${lat.date})</div>`);
  });
  wrap.innerHTML=alerts.join('');
}

// ── TENDENCIA 7 DÍAS ───────────────────────────────────────
function getTrend(sid,metric){
  const rows=[...history].filter(r=>r.songId===sid).sort((a,b)=>a.date.localeCompare(b.date));
  if(rows.length<2)return null;
  const last7=rows.slice(-7);
  if(last7.length<2)return null;
  const first=last7[0][metric],last=last7[last7.length-1][metric];
  if(!first||!last)return null;
  const pct=((last-first)/first)*100;
  return pct;
}

// ── FILTRO RANGO FECHAS ────────────────────────────────────
function getFilteredHistory(){
  if(dateRange===0)return history;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-dateRange);
  const cutStr=cutoff.toISOString().slice(0,10);
  return history.filter(r=>r.date>=cutStr);
}

// ── EXPORTAR CSV ───────────────────────────────────────────
function exportCSV(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const filtered=getFilteredHistory().filter(r=>{
    if(q&&!r.songName.toLowerCase().includes(q))return false;
    if(!selectedSongs.includes(r.songId))return false;
    return true;
  });
  const rows=[['Fecha','Canción','Publicaciones','Visualizaciones','Crec. Pub %','Crec. Vis %']];
  filtered.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    rows.push([r.date,r.songName,r.publicaciones,r.visualizaciones,
      isNaN(r.crecPub)?'':r.crecPub.toFixed(4),
      isNaN(r.crecVis)?'':r.crecVis.toFixed(4)]);
  });
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='lujo_tiktok_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

// ── SORT ───────────────────────────────────────────────────
function sortBy(col){
  if(sortCol===col)sortDir*=-1; else{sortCol=col;sortDir=-1;}
  document.querySelectorAll('th .sort-icon').forEach(el=>el.textContent='↕');
  const el=document.getElementById('sort-'+col);
  if(el)el.textContent=sortDir===-1?'↓':'↑';
  renderHistory();
}

// ── RENDER ─────────────────────────────────────────────────
function renderSongs(){
  const q=document.getElementById('search-input').value.toLowerCase();
  document.getElementById('songs-row').innerHTML=SONGS.filter(s=>!q||s.name.toLowerCase().includes(q)).map(s=>{
    const active=selectedSongs.includes(s.id);
    return`<div class="song-chip" style="${active?`border-color:${s.color};background:${s.color}15;color:#111`:''}" onclick="toggleSong(${s.id})">
      <div class="sdot" style="background:${s.color}"></div>${s.name}
    </div>`;
  }).join('');
  document.getElementById('chart-legend').innerHTML=SONGS.filter(s=>selectedSongs.includes(s.id)).map(s=>
    `<div class="leg-item"><div class="leg-dot" style="background:${s.color}"></div>${s.name.split(' ').slice(0,2).join(' ')}</div>`
  ).join('');
}

function renderMetrics(){
  const labels={publicaciones:'Publicaciones',visualizaciones:'Visualizaciones',crecimiento:'Crec. pub %'};
  const q=document.getElementById('search-input').value.toLowerCase();
  const cards=SONGS.filter(s=>selectedSongs.includes(s.id)&&(!q||s.name.toLowerCase().includes(q))).map(s=>{
    const lat=getLatest(s.id);
    const lastUpdDate=lat?lat.date:'—';
    const daysSince=lat?Math.round((new Date()-new Date(lat.date))/(1000*60*60*24)):null;
    const lastUpdStr=daysSince===0?'Hoy':daysSince===1?'Ayer':(daysSince!==null?`Hace ${daysSince}d`:'—');
    if(!lat)return`<div class="mcard" style="border-top-color:${s.color}">
      <div class="mcard-song">${s.name}</div><div class="mcard-label">Sin datos</div>
      <div class="last-upd">Sin registros</div></div>`;
    const prev=getPrev(s.id,lat.date);
    let val,d=null;
    if(currentMetric==='crecimiento'){val=lat.crecPub!=null?lat.crecPub.toFixed(2)+'%':'—';}
    else{val=fmt(lat[currentMetric]);if(prev)d=calcCrec(lat[currentMetric],prev[currentMetric]);}
    const trend=getTrend(s.id,currentMetric==='crecimiento'?'publicaciones':currentMetric);
    const trendLabel=trend===null?'':trend>1?'▲ Subiendo':trend<-1?'▼ Bajando':'→ Estable';
    const trendCls=trend===null?'flat':trend>1?'up':trend<-1?'down':'flat';
    const short=s.name.length>24?s.name.slice(0,22)+'…':s.name;
    return`<div class="mcard" style="border-top-color:${s.color}">
      <div class="mcard-song">${short}</div>
      <div class="mcard-label">${labels[currentMetric]||currentMetric}</div>
      <div class="mcard-value">${val}</div>
      <div class="mcard-bottom">
        <span class="mbadge ${dc(d)}">${d!==null?fmtPct(d):'Primer registro'}</span>
        ${trend!==null?`<span class="trend ${trendCls}">${trendLabel}</span>`:''}
      </div>
      <div class="last-upd">Último: ${lastUpdStr} (${lastUpdDate})</div>
    </div>`;
  });
  document.getElementById('metrics-grid').innerHTML=cards.join('');
}

function renderChart(){
  const fh=getFilteredHistory();
  const q=document.getElementById('search-input').value.toLowerCase();
  const activeSongs=SONGS.filter(s=>selectedSongs.includes(s.id)&&(!q||s.name.toLowerCase().includes(q)));
  const dates=[...new Set(fh.map(r=>r.date))].sort();
  const ctx=document.getElementById('mainChart').getContext('2d');
  if(chart)chart.destroy();
  function fmtLabel(d){
    d=String(d||'');
    if(d.includes('-')){const p=d.split('-');return(p[2]||'').padStart(2,'0')+'/'+(p[1]||'').padStart(2,'0');}
    return d;
  }
  const datasets=activeSongs.map((s,i)=>({
    label:s.name,
    data:dates.map(d=>{const r=fh.find(h=>h.songId===s.id&&h.date===d);if(!r)return null;return currentMetric==='crecimiento'?r.crecPub:r[currentMetric];}),
    borderColor:s.color,backgroundColor:s.color+'20',
    tension:0.3,fill:false,spanGaps:true,
    pointRadius:4,pointHoverRadius:6,borderWidth:2,
    borderDash:i===0?[]:[6,3],
  }));
  chart=new Chart(ctx,{
    type:'line',
    data:{labels:dates.map(d=>fmtLabel(d)),datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#1E293B',borderColor:'#334155',borderWidth:1,titleColor:'#94A3B8',bodyColor:'#F1F5F9',padding:11,cornerRadius:6,
          callbacks:{label:c=>{const v=c.raw;if(v==null)return'';return` ${c.dataset.label}: ${currentMetric==='crecimiento'?v.toFixed(2)+'%':fmt(v)}`;}}
        }
      },
      scales:{
        x:{grid:{color:'#F3F4F6'},ticks:{color:'#6B7280',font:{family:'Inter',size:11},maxRotation:45,autoSkip:true,maxTicksLimit:12}},
        y:{grid:{color:'#F3F4F6'},ticks:{color:'#6B7280',font:{family:'Inter',size:11},callback:v=>currentMetric==='crecimiento'?v.toFixed(1)+'%':fmt(v)}}
      }
    }
  });
}

function renderHistory(){
  const q=document.getElementById('search-input').value.toLowerCase();
  const fh=getFilteredHistory();
  let rows=fh.filter(r=>selectedSongs.includes(r.songId)&&(!q||r.songName.toLowerCase().includes(q)));
  rows=rows.map(r=>{
    const prev=getPrev(r.songId,r.date);
    return{...r,_dPub:prev?calcCrec(r.publicaciones,prev.publicaciones):null,_dVis:prev?calcCrec(r.visualizaciones,prev.visualizaciones):null};
  });
  rows.sort((a,b)=>{
    let va=a[sortCol]??a['_d'+sortCol.replace('crec','')]??'';
    let vb=b[sortCol]??b['_d'+sortCol.replace('crec','')]??'';
    if(sortCol==='crecPub'){va=a._dPub??-Infinity;vb=b._dPub??-Infinity;}
    if(sortCol==='crecVis'){va=a._dVis??-Infinity;vb=b._dVis??-Infinity;}
    if(va<vb)return sortDir;if(va>vb)return-sortDir;return 0;
  });
  if(!rows.length){
    document.getElementById('history-body').innerHTML='<tr><td colspan="6" style="text-align:center;padding:36px;color:#9CA3AF;">Sin registros.</td></tr>';
    return;
  }
  document.getElementById('history-body').innerHTML=rows.map(r=>{
    const s=SONGS[r.songId]||SONGS[0];
    return`<tr>
      <td style="color:#6B7280;font-variant-numeric:tabular-nums">${r.date}</td>
      <td><span class="pill" style="background:${s.color}15;color:${s.color};border:1px solid ${s.color}35">${(r.songName||s.name).slice(0,22)}</span></td>
      <td style="font-variant-numeric:tabular-nums">${fmt(r.publicaciones)}</td>
      <td style="font-variant-numeric:tabular-nums">${fmt(r.visualizaciones)}</td>
      <td><span class="bbadge ${dc(r._dPub)}">${fmtPct(r._dPub)}</span></td>
      <td><span class="bbadge ${dc(r._dVis)}">${fmtPct(r._dVis)}</span></td>
    </tr>`;
  }).join('');
}

function renderAll(){ renderSongs();renderMetrics();renderChart();renderHistory(); }

function toggleSong(id){
  if(selectedSongs.includes(id)){if(selectedSongs.length===1)return;selectedSongs=selectedSongs.filter(s=>s!==id);}
  else selectedSongs.push(id);
  renderAll();
}
function switchMetric(m,btn){
  currentMetric=m;
  document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMetrics();renderChart();
}
function switchRange(r,btn){
  dateRange=r;
  document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();renderHistory();
}

window.onload=()=>{ initGoogleAuth(); };
